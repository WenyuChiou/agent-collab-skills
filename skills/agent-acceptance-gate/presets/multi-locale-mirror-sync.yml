# Preset: multi-locale-mirror-sync
# Structural verification for any two or more locale variants.

preset_name: multi-locale-mirror-sync
description: |
  Verify that an explicit list of locale files preserves document structure,
  required technical terms, diagrams, links, and locale-specific writing
  contracts. This preset does not infer filenames from a fixed three-locale
  convention and does not use line count as a translation-quality proxy.

invocation_param:
  files:
    description: "Comma-separated locale files; two or more are required."
    required: true
  required_terms:
    description: "Comma-separated exact technical terms required in every file."
    required: false
    default: ""
  locale_profiles:
    description: |
      Optional file-to-profile mapping, such as README.zh-TW.md=zh-TW.
      A profile adds locale-specific script and terminology checks.
    required: false
    default: ""
  brief_file:
    description: |
      Optional task brief used to verify that claimed target writes happened
      after execution began. Omit for primary-agent or manual edits.
    required: false
    default: ""

checks:
  - id: file_existence
    type: files_exist
    files_param: files
    require: all

  - id: h2_parity
    type: file_pattern_count
    files_param: files
    pattern: "^## "
    require: same_count
    note: "A section added or dropped in one locale is blocking."

  - id: table_structure_parity
    type: table_structure_check
    files_param: files
    require: matching_column_count_per_table_index
    note: "Translated cell text may differ; table topology may not."

  - id: mermaid_node_parity
    type: mermaid_structure_check
    files_param: files
    compare: node_ids
    require: same_set

  - id: mermaid_edge_parity
    type: mermaid_structure_check
    files_param: files
    compare: normalized_edges
    require: same_multiset

  - id: required_terms_cross_locale
    type: pattern_present_all_files
    files_param: files
    patterns_param: required_terms
    skip_when_empty: true

  - id: internal_link_resolution
    type: markdown_relative_links_exist
    files_param: files
    require: all

  - id: stale_time_language
    type: pattern_absent
    files_param: files
    patterns:
      - "pushed today"
      - "updated today"
      - "今天已更新"
      - "今天 pushed"
      - "very recently"
    exempt_when_inside_quotes: true

  - id: unrequested_attribution_lines
    type: pattern_absent
    files_param: files
    severity: warn
    patterns:
      - "^>?\\s*Attributions?:\\s*"
      - "^>?\\s*Sources?:\\s*"
      - "^>?\\s*Credits?:\\s*"
      - "^>?\\s*Citations?:\\s*"

  - id: locale_profile
    type: locale_profile_check
    files_param: files
    profiles_param: locale_profiles
    skip_when_empty: true
    profiles:
      zh-TW:
        require_any:
          - "繁體中文"
          - "人類"
        reject:
          - "软件"
          - "网络"
          - "数据"
      zh-Hans:
        reject:
          - "軟體"
          - "網路"
          - "資料"

  - id: markdown_anchor_resolution
    type: markdown_anchor_links_resolve
    files_param: files
    require: all

  - id: post_brief_mtime_check
    type: file_mtime_after
    files_param: files
    reference_file_param: brief_file
    skip_when_empty: true
    severity: fail

failure_action: |
  Preserve the failed check and evidence. Request a human-authorized targeted
  correction, then re-run this preset only when canonical policy permits the
  next cycle. Do not replace a FAIL with agent consensus or a manual claim.
